upstream frontend_upstream { server frontend:80; }
upstream auth_upstream { server auth-service:5001; }
upstream links_upstream { server links-service:5002; }
upstream analytics_upstream { server analytics-service:5003; }

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  location /api/auth/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://auth_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location = /api/admin/users {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://auth_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location ~ ^/api/links/[^/]+/stats$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://analytics_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location /api/links {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://links_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location /s/ {
    proxy_pass http://links_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
