services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  links-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: links_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - links_db_data:/var/lib/postgresql/data

  analytics-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - analytics_db_data:/var/lib/postgresql/data

  auth-service:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db
      JWT_SECRET: super-secret-jwt
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: 123
      INSTANCE_NAME: auth-a
    depends_on:
      - auth-db

  auth-service-b:
    build:
      context: ..
      dockerfile: auth-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@auth-db:5432/auth_db
      JWT_SECRET: super-secret-jwt
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: 123
      INSTANCE_NAME: auth-b
    depends_on:
      - auth-db

  links-service:
    build:
      context: ..
      dockerfile: links-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@links-db:5432/links_db
      JWT_SECRET: super-secret-jwt
      IP_SALT: dev-salt
      BASE_URL: http://localhost
      ANALYTICS_INTERNAL_URL: http://analytics-service:5003
      INSTANCE_NAME: links-a
    depends_on:
      - links-db
      - analytics-service

  links-service-b:
    build:
      context: ..
      dockerfile: links-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@links-db:5432/links_db
      JWT_SECRET: super-secret-jwt
      IP_SALT: dev-salt
      BASE_URL: http://localhost
      ANALYTICS_INTERNAL_URL: http://analytics-service:5003
      INSTANCE_NAME: links-b
    depends_on:
      - links-db
      - analytics-service

  analytics-service:
    build:
      context: ..
      dockerfile: analytics-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@analytics-db:5432/analytics_db
      LINKS_INTERNAL_URL: http://links-service:5002
      INSTANCE_NAME: analytics-a
    depends_on:
      - analytics-db

  analytics-service-b:
    build:
      context: ..
      dockerfile: analytics-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@analytics-db:5432/analytics_db
      LINKS_INTERNAL_URL: http://links-service:5002
      INSTANCE_NAME: analytics-b
    depends_on:
      - analytics-db

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - auth-service
      - links-service
      - analytics-service

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/lb-upstreams.conf:/etc/nginx/conf.d/lb-upstreams.conf:ro
    depends_on:
      - frontend
      - auth-service
      - auth-service-b
      - links-service
      - links-service-b
      - analytics-service
      - analytics-service-b

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - auth-service-b
      - links-service
      - links-service-b
      - analytics-service
      - analytics-service-b

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  auth_db_data:
  links_db_data:
  analytics_db_data:
  grafana_data: