events {}

http {
    include /etc/nginx/conf.d/lb-upstreams.conf;

    upstream frontend_pool {
        server frontend:80;
    }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/auth/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_pass http://auth_pool;
            add_header X-LB-Mode $lb_mode always;
        }

        location /api/admin/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_pass http://auth_pool;
            add_header X-LB-Mode $lb_mode always;
        }

        location ~ ^/api/links/[^/]+/stats/?$ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_pass http://analytics_pool;
            add_header X-LB-Mode $lb_mode always;
        }

        location /api/links/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_pass http://links_pool;
            add_header X-LB-Mode $lb_mode always;
        }

        location /api/links {
            rewrite ^/api(/.*)$ $1 break;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_pass http://links_pool;
            add_header X-LB-Mode $lb_mode always;
        }

        location /s/ {
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_pass http://links_pool;
            add_header X-LB-Mode $lb_mode always;
        }

        location / {
            proxy_pass http://frontend_pool;
        }
    }
}